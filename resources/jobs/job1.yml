resources:
  jobs:
    job1:
      name: job1
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: WEEKS
      tasks:
        - task_key: notebook1
          notebook_task:
            notebook_path: ../../src/notebook1.ipynb
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
